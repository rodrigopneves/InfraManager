[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app/*/__init__.py" = ["E402", "F401"]

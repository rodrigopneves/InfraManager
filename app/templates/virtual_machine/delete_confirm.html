{% extends "base.html" %}

{% block content %}
  <h1>Confirmar exclusão</h1>
  <p>Confirme a exclusão da Máquina Virtual <strong>{{ virtual_machine.name }}</strong>.</p>
  <form method="post" action="{{ url_for('virtual_machine.delete', virtual_machine_id=virtual_machine.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">Confirmar exclusão</button>
  </form>
  <p><a href="{{ url_for('virtual_machine.detail', virtual_machine_id=virtual_machine.id) }}">Cancelar</a></p>
{% endblock %}
